<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>카지노 토참시</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    .wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 클릭 영역 공통 */
    .click-zone {
      position: absolute;
      left: 8.3%;
      width: 85.2%;

      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* 1. 생방송 공지방 */
    .zone1 {
      top: 50.3%;
      height: 11.4%;
    }

    /* 2. 카카오톡 문의 */
    .zone2 {
      top: 62.7%;
      height: 11.4%;
    }

    /* 3. 텔레그램 문의 */
    .zone3 {
      top: 75.1%;
      height: 11.4%;
    }

    /* 4. 토참시 가족방 */
    .zone4 {
      top: 87.4%;
      height: 11.2%;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- 랜딩 이미지 -->
    <img
      src="./landing.png.png"
      alt="카지노 토참시 랜딩페이지"
    />

    <!-- 1. 생방송 공지방 -->
    <a
      class="click-zone zone1"
      href="https://xn--vv4b54ovoe.com/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="생방송 공지방">
    </a>

    <!-- 2. 카카오톡 문의 -->
    <a
      class="click-zone zone2"
      href="https://open.kakao.com/o/sZPGH9Dg"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="카카오톡 문의">
    </a>

    <!-- 3. 텔레그램 문의 -->
    <a
      class="click-zone zone3"
      href="https://telegram.me/storyinquiry"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="텔레그램 문의">
    </a>

    <!-- 4. 토참시 가족방 -->
    <a
      class="click-zone zone4"
      href="https://open.kakao.com/o/gJqGHqLi"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="토참시 가족방">
    </a>

  </div>

</body>
</html>
