<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카지노 토참시</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      margin: auto;
    }

    /* PC 크기 */
    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    /* 이미지 */
    .wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 클릭 영역 */
    .click-zone {
      position: absolute;
      left: 3%;
      width: 94%;
      height: 12%;
      cursor: pointer;
      z-index: 10;
    }

    /* 각각 위치 */
    .zone1 {
      top: 42%;
    }

    .zone2 {
      top: 57.5%;
    }

    .zone3 {
      top: 72%;
    }

    .zone4 {
      top: 86%;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <img src="landing.png.png" alt="랜딩 이미지" />

    <!-- 1. 유튜브 -->
    <a class="click-zone zone1"
       href="https://xn--vv4b54ovoe.com"
       target="_blank"
       rel="noopener noreferrer">
    </a>

    <!-- 2. 카카오톡 -->
    <a class="click-zone zone2"
       href="https://open.kakao.com/o/sZPGH9Dg"
       target="_blank"
       rel="noopener noreferrer">
    </a>

    <!-- 3. 텔레그램 -->
    <a class="click-zone zone3"
       href="https://telegram.me/storyinquiry"
       target="_blank"
       rel="noopener noreferrer">
    </a>

    <!-- 4. 토참시 가족방 -->
    <a class="click-zone zone4"
       href="https://open.kakao.com/o/gTZm5cli"
       target="_blank"
       rel="noopener noreferrer">
    </a>

  </div>

</body>
</html>
